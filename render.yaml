# Initially closed for private content review. No seeds or custom domain cutover.
services:
  - type: web
    name: alikhan-blog
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py wsgi:app
    autoDeployTrigger: 'off'
    healthCheckPath: /healthz
    disk:
      name: blog-data
      mountPath: /var/data/blog
      sizeGB: 1
    envVars:
      - key: FLASK_SKIP_DOTENV
        value: '1'
      - key: BLOG_ENV
        value: production
      - key: BLOG_DATA_DIR
        value: /var/data/blog
      - key: BLOG_PUBLIC_ENABLED
        value: 'false'
      - key: BLOG_EMAIL_MODE
        value: test
      - key: BLOG_EMAIL_TEST_ADDRESS
        sync: false
      - key: BLOG_PUBLIC_BASE_URL
        sync: false
      - key: BLOG_EMAIL_FROM
        sync: false
      - key: RESEND_API_KEY
        sync: false
